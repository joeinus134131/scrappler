version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: scrappler_postgres
    environment:
      POSTGRES_USER: scrappler
      POSTGRES_PASSWORD: scrappler_password
      POSTGRES_DB: scrappler_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scrappler_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
